# Quiz Battle - Docker Compose
#
# Cách dùng (PRODUCTION):
#   1. Copy `.env.example.production` thành `.env` ở thư mục gốc.
#   2. Sửa .env: điền SECRET_KEY, POSTGRES_PASSWORD, GEMINI_PROXY_API_KEY...
#      (Tất cả secret phải generate MỚI, không dùng giá trị cũ từ git history.)
#   3. Chạy: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#      (docker-compose.prod.yml sẽ được tạo ở bước sau để không publish port dev.)
#
# Tham chiếu: DOCKER_RUN.md, PHASE2_SETUP.md, PHASE3_GEMINI_MIGRATION.md

# Lưu ý bảo mật:
#   - File này không hardcode bất kỳ secret nào.
#   - Mọi biến nhạy cảm PHẢI có trong file .env (không có fallback mặc định).
#   - Nếu deploy mà thiếu biến, container sẽ fail ngay khi khởi động (an toàn hơn
#     là dùng password mặc định yếu).

services:
  db:
    image: postgres:15-alpine
    container_name: quiz_battle_db
    restart: unless-stopped
    environment:
      # Bắt buộc có trong .env — KHÔNG fallback. Nếu thiếu, container sẽ crash
      # với lỗi "env var required" thay vì dùng password yếu mặc định.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # Không publish 5432 ra host mặc định — bật lại chỉ khi debug cần kết nối ngoài.
    # Khi cần: dùng `docker compose -f docker-compose.yml -f docker-compose.override.yml up`
    # hoặc `docker exec -it quiz_battle_db psql ...` từ trong container.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quiz_battle_redis
    restart: unless-stopped
    # Production: không publish port ra host, dùng expose để các container
    # trong compose network vẫn truy cập được.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: quiz_battle_qdrant
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant image không có curl/wget, dùng TCP port check (bash /dev/tcp).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'qdrant' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz_battle_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Database — BẮT BUỘC từ .env, không fallback.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Redis
      REDIS_URL: redis://redis:6379/0
      ROOM_SESSION_TTL_SECONDS: ${ROOM_SESSION_TTL_SECONDS:-86400}
      # App — SECRET_KEY BẮT BUỘC, không có default.
      DEBUG: ${BACKEND_DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALGORITHM: ${ALGORITHM:-HS256}
      API_V1_STR: /api/v1
      PROJECT_NAME: Quiz Battle
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      # Gemini proxy — BẮT BUỘC cho Phase 2+.
      GEMINI_PROXY_BASE_URL: ${GEMINI_PROXY_BASE_URL:-https://api.shopaikey.com/v1}
      GEMINI_PROXY_API_KEY: ${GEMINI_PROXY_API_KEY:?GEMINI_PROXY_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      INTENT_ROUTER_MODEL: ${INTENT_ROUTER_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-3072}
      GEMINI_PROXY_TIMEOUT: ${GEMINI_PROXY_TIMEOUT:-30}
      GEMINI_PROXY_MAX_RETRIES: ${GEMINI_PROXY_MAX_RETRIES:-2}
      # Qdrant
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-3072}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      # Embedding / retrieval tunables
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_MAX_CHARS: ${EMBEDDING_MAX_CHARS:-8000}
      RETRIEVAL_DEFAULT_TOP_K: ${RETRIEVAL_DEFAULT_TOP_K:-10}
      RETRIEVAL_MAX_TOP_K: ${RETRIEVAL_MAX_TOP_K:-50}
      RETRIEVAL_CANDIDATE_MULTIPLIER: ${RETRIEVAL_CANDIDATE_MULTIPLIER:-3}
      # Google OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Email OTP (optional)
      EMAIL_OTP_EXPIRE_MINUTES: ${EMAIL_OTP_EXPIRE_MINUTES:-10}
      EMAIL_OTP_RESEND_SECONDS: ${EMAIL_OTP_RESEND_SECONDS:-60}
      EMAIL_OTP_MAX_ATTEMPTS: ${EMAIL_OTP_MAX_ATTEMPTS:-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-True}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Qdrant: chỉ chờ start, không chờ healthy.
      # Backend tự retry kết nối khi Qdrant chưa sẵn sàng.
      qdrant:
        condition: service_started
    command: python -B -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tất cả NEXT_PUBLIC_* phải được truyền qua build args,
        # vì Next.js bake giá trị vào JS bundle lúc build (không đọc runtime env).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_REDIRECT_URI: ${NEXT_PUBLIC_GOOGLE_REDIRECT_URI:-}
    container_name: quiz_battle_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Production KHÔNG mount source vào container (tránh dev volume).
    # Nếu cần dev hot-reload, dùng docker-compose.override.yml.
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: ${NEXT_PUBLIC_GOOGLE_REDIRECT_URI:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
